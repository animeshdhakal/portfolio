[package]
name = "portfolio-dioxus"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6.3", features = ["web"] }
dioxus-web = "0.6.3"
web-sys = { version = "0.3.77", features = [
    "Window",
    "Document",
    "Navigator",
    "Clipboard",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "KeyboardEvent",
    "Element",
    "Storage",
    "DomTokenList"
] }
wasm-bindgen = "0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
